name: Refresh listings and deploy

# Runs monthly to refresh listings, and on every push to main. Either way it
# republishes the site to GitHub Pages (Settings > Pages > Source: GitHub Actions).
on:
  schedule:
    - cron: '17 14 1 * *'   # 1st of each month, 6:17 AM Pacific standard time
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Fetch listings
        if: github.event_name != 'push'
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: node scripts/fetch-listings.mjs
      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update listings $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
